save_dir: ./data

# Hold each policy action for four 120 Hz physics steps.
decimation: 4

save_frequency: 2
video_frequency: 0
render_frequency: 0

random_texture: false

use_seed: true
episode_num: 5

sensor_type: gsmini

observations:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true
